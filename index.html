<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spatial reasoning study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;               /* same look for every participant: no dark mode on purpose */
    --backdrop: #DAD7D1;               /* the renders' studio grey */
    --paper: #FBFAF8;
    --ink: #1F1E1C;
    --muted: #5F5B55;
    --line: #CFCAC2;
    --walnut: #6B4429;                 /* table wood */
    --walnut-soft: #F1ECE6;
    --focus: #2F5D8A;
    --viewer: #2F5D8A;
    --object: #9A4F1C;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--backdrop);
    color: var(--ink);
    font: 400 1.0625rem/1.55 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .sheet {
    background: var(--paper);
    border-radius: 8px;
    width: 100%;
    max-width: 960px;
    padding: clamp(20px, 4vw, 44px);
  }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 18px; letter-spacing: -0.01em; }
  h2 { font-size: 1.125rem; line-height: 1.3; margin: 28px 0 10px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); }

  /* Intro: page 1 is one reading column; page 2 is wider so the points-of-view figure shows near full size */
  /* Intro: page 1 is one reading column; page 2 is wider so the points-of-view figure shows near full size */
  .sheet.intro { max-width: 720px; }
  .sheet.intro.frames-page { max-width: 960px; }
  .sheet.intro.frames-page { max-width: 960px; }
  .intro ul { margin: 0 0 14px; padding-left: 1.1em; }
  .intro li { margin-bottom: 10px; }
  .consent { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 22px; color: var(--muted); }

  .frames { margin: 20px 0 24px; }
  .frames-scroll { background: #fff; border-radius: 6px; }
  .frames-scroll img { display: block; width: 100%; max-width: 881px; height: auto; margin: 0 auto; }   /* fits the screen, never enlarged past its real size (blurry) */
  .frames-scroll img { display: block; width: 100%; max-width: 881px; height: auto; margin: 0 auto; }   /* fits the screen, never enlarged past its real size (blurry) */
  .frames figcaption { font-size: 0.95rem; color: var(--muted); margin-top: 10px; }

  /* Buttons */
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
  button, .button {
    font: inherit;
    font-weight: 700;
    font-size: 1.0625rem;
    border-radius: 6px;
    padding: 12px 22px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .primary { background: var(--walnut); color: #fff; border: 2px solid var(--walnut); }
  .primary:hover { background: #573620; border-color: #573620; }
  .secondary { background: var(--paper); color: var(--walnut); border: 2px solid var(--walnut); }
  .secondary:hover { background: var(--walnut-soft); }
  button:focus-visible, .button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  button:disabled { opacity: 0.45; cursor: default; }

  /* Trial */
  .trial { max-width: 760px; text-align: center; padding-top: 0; overflow: hidden; }
  .progress { height: 5px; background: var(--walnut-soft); margin: 0 calc(-1 * clamp(20px, 4vw, 44px)) 0; }
  .progress span { display: block; height: 100%; background: var(--walnut); }
  .count { color: var(--muted); font-size: 0.95rem; margin: 14px 0 12px; }
  .stim { margin: 0 auto; width: min(56vh, 100%); width: min(56dvh, 100%); aspect-ratio: 1; background: #D4D1CB; border-radius: 6px; overflow: hidden; }
  .stim img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .question { font-size: 1.375rem; font-weight: 700; line-height: 1.35; max-width: 36ch; margin: 20px auto 18px; min-height: 2.7em; }
  .answers { display: flex; gap: 14px; justify-content: center; }
  .answers button {             /* Yes and No look identical on purpose, to avoid nudging answers */
    min-width: 150px;
    background: var(--paper);
    color: var(--walnut);
    border: 2px solid var(--walnut);
    font-size: 1.1875rem;
    padding: 14px 26px;
  }
  .answers button:hover:not(:disabled) { background: var(--walnut-soft); }
  .answers button.chosen { background: var(--walnut); color: #fff; opacity: 1; }
  kbd { font: inherit; font-size: 0.8em; font-weight: 400; border: 1px solid currentColor; border-radius: 4px; padding: 0 6px; opacity: 0.7; }
  @media (hover: none) and (pointer: coarse) { kbd, .keys-hint { display: none; } }   /* phones: no keyboard */
  .feedback { margin: 18px auto 0; max-width: 46ch; }
  .feedback p { font-size: 1.125rem; margin-bottom: 4px; }
  .feedback .actions { justify-content: center; margin-top: 12px; }
  .isi > *:not(.progress) { visibility: hidden; }
  @media (max-width: 520px) {
    .answers button { flex: 1; min-width: 0; }
    .question { font-size: 1.2rem; }
    h1 { font-size: 1.6rem; }
  }

  /* Messages */
  .message { max-width: 620px; }
  .message h1 { font-size: 1.6rem; }
  .detail { font-size: 0.9rem; color: var(--muted); background: var(--walnut-soft); border-radius: 4px; padding: 8px 10px; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>

<!--
  ===================== INTRO TEXT (edit freely) =====================
  {{N}} becomes the number of questions in the participant's set,
  {{MINUTES}} becomes CONFIG.MINUTES.
-->
<template id="intro-text">
  <h1>Spatial reasoning study</h1>
  <p>Thank you for taking part! The study takes about {{MINUTES}} minutes.</p>
  <p>You will see {{N}} images of small scenes. Each scene contains a <strong>reference object</strong> (a teddy bear, a bunny or Pinocchio) and a <strong>target object</strong> (for example a cat, a car or a toy train). For each image, you will answer one yes/no question about where the target object is, or which way it is facing.</p>
  <h2>Each question tells you from whose point of view to answer</h2>
  <ul>
    <li><strong>“Relative to the viewer”</strong>: your point of view. Left and right as you see them on the screen; “in front of” means closer to you.</li>
<li><strong>“Relative to the teddy bear’s coordinate axes”</strong> (or another reference object’s): the reference object’s point of view. Imagine standing in its place, facing the same way it faces. When it faces you, its left is your right.</li>    <li><strong>“…body coordinate axes” or “…head coordinate axes”</strong>: sometimes the reference object turns its head, so its body and its head face different directions. Use the part the question names.</li>
    <!-- TODO: add one line saying what "facing forward / backward / left / right" means in your benchmark. -->
  </ul>
  <p>There are no trick questions and there is no time limit, but please answer every question as accurately as you can.<span class="keys-hint"> You can use the buttons or the <kbd>Y</kbd> and <kbd>N</kbd> keys.</span></p>
  <p class="muted">On the next page you'll see an example of each point of view.</p>
</template>

<template id="intro-figure">
  <h1>The points of view</h1>
  <p>The same directions (left, right, front, behind, up) can be measured from the viewer, from a whole object, or from one of its parts. Take a moment to look at each example.</p>
  <h1>The points of view</h1>
  <p>The same directions (left, right, front, behind, up) can be measured from the viewer, from a whole object, or from one of its parts. Take a moment to look at each example.</p>
  <figure class="frames">
    <div class="frames-scroll">
      <img src="images/Slide1.jpg" width="881" height="182"
           alt="Four examples of points of view: the viewer's (left, right, front, behind as seen by the camera), a whole object's (the teddy bear's own up, front and right), and a part's (the bunny's and Pinocchio's head, with their own front and left or right).">
    </div>
    <figcaption>From left to right: the viewer's point of view; the teddy bear's own (object) point of view; the bunny's head and Pinocchio's head (part) points of view. The arrows show each one's own up, front, left and right.</figcaption>
    <figcaption>From left to right: the viewer's point of view; the teddy bear's own (object) point of view; the bunny's head and Pinocchio's head (part) points of view. The arrows show each one's own up, front, left and right.</figcaption>
  </figure>
  <p class="consent">Participation is voluntary and anonymous: we only record your answers, and you can stop at any time. By continuing, you agree to take part.</p>
  <p class="consent">Participation is voluntary and anonymous: we only record your answers, and you can stop at any time. By continuing, you agree to take part.</p>
</template>

<script>
"use strict";

/* ===================== SETTINGS ===================== */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbw2Qgl3Jwd0nzkRe_hMo3gbPdMkSmiCg4iOG-vgs2sObQ64M_ofT0eoDBsWOfyjr4ox/exec",            // Google Apps Script web app URL (ends in /exec). Empty = demo mode: nothing is sent.
  TRIALS_FILE: "trials.csv",
  MINUTES: 10,             // shown on the intro screen
  COMPLETION_URL: "",      // optional: link shown at the end (e.g. your Prolific completion URL)
  CONTACT_EMAIL: "",       // shown if answers can't be sent
  INTER_TRIAL_MS: 300,     // blank pause between questions
  STUDY_ID: "spatial-study",
};
/* ==================================================== */

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const STORE_KEY = CONFIG.STUDY_ID + ":session";
let S = null;              // session state
let keyHandler = null;

document.addEventListener("keydown", (e) => { if (keyHandler) keyHandler(e); });
window.addEventListener("beforeunload", (e) => {
  if (S && (S.phase === "practice" || S.phase === "main")) { e.preventDefault(); e.returnValue = ""; }
});

/* ---------- small helpers ---------- */
const store = {
  load() { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch { return null; } },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} },
  clear() { try { localStorage.removeItem(STORE_KEY); } catch {} },
};
function randInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function uid() { const a = new Uint8Array(8); crypto.getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join(""); }
function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = randInt(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function parseCSV(text) {
  const rows = []; let row = [], field = "", quoted = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  const header = (rows.shift() || []).map((h) => h.trim());
  const data = rows
    .filter((r) => r.some((v) => v.trim() !== ""))
    .map((r) => Object.fromEntries(header.map((h, j) => [h, (r[j] ?? "").trim()])));
  return { header, rows: data };
}

function toCSV(records) {
  const cols = orderedKeys(records);
  const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(","), ...records.map((r) => cols.map((c) => cell(r[c])).join(","))].join("\n");
}
function orderedKeys(records) {
  const seen = new Set(); const out = [];
  for (const r of records) for (const k of Object.keys(r)) if (!seen.has(k)) { seen.add(k); out.push(k); }
  return out;
}
function download(filename, text) {
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function preload(list, from, n) {
  for (let k = from; k < Math.min(list.length, from + n); k++) { const im = new Image(); im.src = list[k].image; }
}

/* ---------- screens ---------- */
function render(html, cls = "sheet message") {
  keyHandler = null;
  app.innerHTML = `<section class="${cls}">${html}</section>`;
  const first = app.querySelector("button, .button");
  if (first) first.focus({ preventScroll: true });
}

function renderError(title, detail) {
  render(`<h1>${esc(title)}</h1>${detail ? `<p class="detail">${esc(detail)}</p>` : ""}`);
}

function renderIntro() {
  const n = S.main.length;
  const text = document.getElementById("intro-text").innerHTML
    .replaceAll("{{N}}", String(n)).replaceAll("{{MINUTES}}", String(CONFIG.MINUTES));
  render(`${text}<div class="actions"><button class="primary" id="next">Next</button></div>`, "sheet intro");
  document.getElementById("next").onclick = renderFramesIntro;
  preload(S.practice.length ? S.practice : S.main, 0, 3);
}

function renderFramesIntro() {
  render(`${text}<div class="actions"><button class="primary" id="next">Next</button></div>`, "sheet intro");
  document.getElementById("next").onclick = renderFramesIntro;
  preload(S.practice.length ? S.practice : S.main, 0, 3);
}

function renderFramesIntro() {
  const figure = document.getElementById("intro-figure").innerHTML;
  render(`${figure}<div class="actions">
      <button class="primary" id="start">I agree, start</button>
      <button class="secondary" id="back">Back</button>
    </div>`, "sheet intro frames-page");
  scrollTo(0, 0);
  document.getElementById("back").onclick = () => { renderIntro(); scrollTo(0, 0); };
  render(`${figure}<div class="actions">
      <button class="primary" id="start">I agree, start</button>
      <button class="secondary" id="back">Back</button>
    </div>`, "sheet intro frames-page");
  scrollTo(0, 0);
  document.getElementById("back").onclick = () => { renderIntro(); scrollTo(0, 0); };
  document.getElementById("start").onclick = () => {
    S.started_at = new Date().toISOString();
    if (S.practice.length) { S.phase = "practice"; S.i = 0; store.save(); renderPracticeIntro(); }
    else startMain();
  };
}

function renderPracticeIntro() {
  const p = S.practice.length;
  render(`
    <h1>Practice first</h1>
    <p>Here ${p === 1 ? "is 1 practice question" : `are ${p} practice questions`} to get used to the task. After each one you'll see the correct answer.</p>
    <div class="actions"><button class="primary" id="go">Start practice</button></div>`);
  document.getElementById("go").onclick = renderTrial;
}

function renderMainIntro() {
  render(`
    <h1>Practice done</h1>
    <p>Now the real questions start: ${S.main.length} in total. From here on you won't see the correct answers.</p>
    <div class="actions"><button class="primary" id="go">Start the questions</button></div>`);
  document.getElementById("go").onclick = renderTrial;
  preload(S.main, 0, 3);
}

function startMain() { S.phase = "main"; S.i = 0; store.save(); renderTrial(); }

function renderResume() {
  const list = S.phase === "practice" ? S.practice : S.main;
  const doneCount = S.phase === "main" ? S.i : 0;
  render(`
    <h1>Welcome back</h1>
    <p>${S.phase === "submit"
      ? "You answered every question, but your answers haven't been saved yet."
      : `You've answered ${doneCount} of ${S.main.length} questions. You can continue where you left off.`}</p>
    <div class="actions"><button class="primary" id="go">${S.phase === "submit" ? "Save my answers" : "Continue"}</button></div>`);
  document.getElementById("go").onclick = () => (S.phase === "submit" ? submit() : renderTrial());
  if (S.phase !== "submit") preload(list, S.i, 2);
}

function renderTrial() {
  const practice = S.phase === "practice";
  const list = practice ? S.practice : S.main;
  const row = list[S.i];
  keyHandler = null;
  app.innerHTML = `
    <section class="sheet trial">
      <div class="progress" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${S.i}">
        <span style="width:${(100 * S.i) / list.length}%"></span>
      </div>
      <p class="count">${practice ? "Practice" : "Question"} ${S.i + 1} of ${list.length}</p>
      <figure class="stim"><img alt="Scene ${S.i + 1}"></figure>
      <p class="question">${esc(row.question)}</p>
      <div class="answers">
        <button type="button" data-r="yes" disabled>Yes <kbd>Y</kbd></button>
        <button type="button" data-r="no" disabled>No <kbd>N</kbd></button>
      </div>
      <div class="feedback" hidden></div>
    </section>`;
  const section = app.querySelector(".trial");
  const img = app.querySelector(".stim img");
  const buttons = [...app.querySelectorAll(".answers button")];
  let t0 = null, answered = false, ready = false;

  const enable = () => {
    if (ready) return; ready = true;
    // start the clock once the image has actually been painted
    requestAnimationFrame(() => requestAnimationFrame(() => { t0 = performance.now(); buttons.forEach((b) => (b.disabled = false)); }));
  };
  img.onload = enable;
  img.onerror = () => {
    if (answered) return; answered = true;
    record(row, "image_error", "");
    const fb = section.querySelector(".feedback");
    fb.hidden = false;
    fb.innerHTML = `<p>This image didn't load, so this question will be skipped.</p><div class="actions"><button class="primary" id="next">Next</button></div>`;
    fb.querySelector("#next").onclick = advance;
    fb.querySelector("#next").focus();
  };
  img.src = row.image;
  if (img.complete && img.naturalWidth) enable();

  const answer = (r) => {
    if (answered || t0 === null) return;
    answered = true;
    const rt = Math.round(performance.now() - t0);
    buttons.forEach((b) => { b.disabled = true; if (b.dataset.r === r) b.classList.add("chosen"); });
    record(row, r, rt);
    if (practice) showPracticeFeedback(section, row, r);
    else { section.classList.add("isi"); setTimeout(advance, CONFIG.INTER_TRIAL_MS); }
  };
  buttons.forEach((b) => b.addEventListener("click", () => answer(b.dataset.r)));
  keyHandler = (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === "y") answer("yes"); else if (k === "n") answer("no");
  };
  preload(list, S.i + 1, 3);
}

function showPracticeFeedback(section, row, r) {
  const truth = (row.answer || "").toLowerCase();
  const fb = section.querySelector(".feedback");
  fb.hidden = false;
  const msg = !truth ? "Thanks."
    : r === truth ? "Correct."
    : `Not quite: the correct answer is <strong>${truth === "yes" ? "Yes" : "No"}</strong>.`;
  const why = row.explanation ? `<p class="muted">${esc(row.explanation)}</p>` : "";
  fb.innerHTML = `<p>${msg}</p>${why}<div class="actions"><button class="primary" id="next">Next</button></div>`;
  const next = fb.querySelector("#next");
  next.onclick = advance;
  next.focus({ preventScroll: true });
  keyHandler = (e) => { if (e.key === "Enter" && !e.repeat) { e.preventDefault(); advance(); } };
}

function record(row, response, rt) {
  const rec = {
    session_id: S.session_id,
    participant_id: S.participant_id,
    session_set: S.set,
    phase: S.phase,
    position: S.i + 1,
  };
  for (const c of S.columns) rec[c === "set" ? "item_set" : c] = row[c] ?? "";
  const truth = (row.answer || "").toLowerCase();
  rec.response = response;
  rec.rt_ms = rt;
  rec.correct = truth && (response === "yes" || response === "no") ? (response === truth ? 1 : 0) : "";
  rec.answered_at = new Date().toISOString();
  S.results.push(rec);
  S.i += 1;
  store.save();
}

function advance() {
  keyHandler = null;
  const list = S.phase === "practice" ? S.practice : S.main;
  if (S.i < list.length) return renderTrial();
  if (S.phase === "practice") { S.phase = "main"; S.i = 0; store.save(); return renderMainIntro(); }
  S.phase = "submit";
  S.finished_at = new Date().toISOString();
  store.save();
  submit();
}

/* ---------- saving ---------- */
async function submit() {
  render(`<h1>Saving your answers…</h1><p class="muted">Please keep this page open for a moment.</p>`);
  if (!CONFIG.ENDPOINT) return renderDone(true);
  const payload = {
    study_id: CONFIG.STUDY_ID,
    session_id: S.session_id,
    participant_id: S.participant_id,
    set: S.set,
    started_at: S.started_at,
    finished_at: S.finished_at,
    user_agent: navigator.userAgent,
    screen: `${screen.width}x${screen.height}`,
    viewport: `${innerWidth}x${innerHeight}`,
    columns: orderedKeys(S.results),
    trials: S.results,
  };
  const body = JSON.stringify(payload);
  const opts = { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body };
  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(CONFIG.ENDPOINT, opts);
      const json = await res.json();
      if (json && json.ok) return finish();
    } catch {
      // The reply couldn't be read (often a browser cross-site restriction even though the
      // answers arrived). Send once more without reading the reply: the sheet ignores duplicates.
      try { await fetch(CONFIG.ENDPOINT, { ...opts, mode: "no-cors" }); return finish(); } catch {}
    }
    await sleep(1500 * (attempt + 1));
  }
  renderSendFailed();
}

function finish() {
  S.phase = "done";
  store.clear();
  renderDone(false);
}

function renderDone(demo) {
  const link = CONFIG.COMPLETION_URL
    ? `<div class="actions"><a class="button primary" href="${esc(CONFIG.COMPLETION_URL)}">Finish the study</a></div>` : "";
  if (demo) {
    render(`
      <h1>Thank you!</h1>
      <p>This page is in demo mode, so your answers weren't sent anywhere. Add the endpoint URL in <code>CONFIG</code> to save answers to the sheet.</p>
      <div class="actions"><button class="secondary" id="dl">Download answers (CSV)</button></div>`);
    document.getElementById("dl").onclick = () => download(`answers_${S.participant_id}.csv`, toCSV(S.results));
    return;
  }
  render(`<h1>Thank you!</h1><p>Your answers have been saved. You can close this page.</p>${link}`);
}

function renderSendFailed() {
  const contact = CONFIG.CONTACT_EMAIL
    ? ` and email the file to <a href="mailto:${esc(CONFIG.CONTACT_EMAIL)}">${esc(CONFIG.CONTACT_EMAIL)}</a>` : " and send the file to the researcher";
  render(`
    <h1>Your answers couldn't be saved</h1>
    <p>Check your internet connection and try again. If it still doesn't work, download your answers${contact}.</p>
    <div class="actions">
      <button class="primary" id="retry">Try again</button>
      <button class="secondary" id="dl">Download answers (CSV)</button>
    </div>`);
  document.getElementById("retry").onclick = submit;
  document.getElementById("dl").onclick = () => download(`answers_${S.participant_id}_${S.session_id}.csv`, toCSV(S.results));
}

/* ---------- start ---------- */
async function assignSet(sets, sessionId) {
  if (!CONFIG.ENDPOINT) return sets[randInt(sets.length)];
  const url = `${CONFIG.ENDPOINT}?action=assign&sets=${encodeURIComponent(sets.join(","))}&session=${encodeURIComponent(sessionId)}`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    const json = await res.json();
    if (json && sets.includes(String(json.set))) return String(json.set);
  } catch {} finally { clearTimeout(timer); }
  return sets[randInt(sets.length)];
}

async function init() {
  const saved = store.load();
  if (saved && saved.v === 1 && ["practice", "main", "submit"].includes(saved.phase)) { S = saved; return renderResume(); }

  if (location.protocol === "file:") {
    return renderError("Open this page through a web address",
      "Browsers block the question file when the page is opened straight from disk. Run `python3 -m http.server` in this folder and open http://localhost:8000, or use the hosted link.");
  }

  let parsed;
  try {
    const res = await fetch(CONFIG.TRIALS_FILE, { cache: "no-store" });
    if (!res.ok) throw new Error(`${CONFIG.TRIALS_FILE}: HTTP ${res.status}`);
    parsed = parseCSV(await res.text());
  } catch (err) {
    return renderError("The study couldn't load its questions", String(err.message || err));
  }
  const missing = ["trial_id", "set", "image", "question"].filter((c) => !parsed.header.includes(c));
  if (missing.length) return renderError("The question file is missing columns", "Missing: " + missing.join(", "));

  const sets = [...new Set(parsed.rows.map((r) => r.set).filter((s) => s && s !== "practice" && s !== "all"))]
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!sets.length) return renderError("The question file has no sets", "Give each question a set number in the 'set' column.");

  const session_id = uid();
  const participant_id = params.get("pid") || params.get("PROLIFIC_PID") || "anon-" + session_id.slice(0, 6);
  const asked = params.get("set");
  const set = asked && sets.includes(asked) ? asked : await assignSet(sets, session_id);

  S = {
    v: 1,
    session_id,
    participant_id,
    set,
    phase: "intro",
    i: 0,
    columns: parsed.header,
    practice: parsed.rows.filter((r) => r.set === "practice"),
    main: shuffle(parsed.rows.filter((r) => r.set === set || r.set === "all")),
    results: [],
    started_at: null,
    finished_at: null,
  };
  renderIntro();
}

init();
</script>
